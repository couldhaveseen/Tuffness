<style>
  html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;background:#000;display:flex;align-items:center;justify-content:center}
  canvas{touch-action:none;height:100vh;height:100dvh;max-width:100vw;aspect-ratio:288/512;image-rendering:pixelated;image-rendering:crisp-edges}
  #mod{display:none;position:fixed;left:0;top:0;bottom:0;width:230px;box-sizing:border-box;padding:16px;background:rgba(20,20,28,.92);color:#fff;font:14px Arial,sans-serif;border-right:3px solid #fc7a24;z-index:9;user-select:none}
  #mod h2{margin:0 0 4px;font-size:18px;color:#fc7a24}
  #mod small{color:#aaa;display:block;margin-bottom:16px}
  #mod .row{margin:14px 0}
  #mod .tog{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px;background:#2c2c3a;border-radius:6px}
  #mod .sw{width:40px;height:20px;border-radius:10px;background:#555;position:relative;transition:.15s}
  #mod .sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
  #mod .on .sw{background:#73bf2e}#mod .on .sw::after{left:22px}
  #mod input[type=range]{width:100%}
  #diff{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;align-items:center;justify-content:center;font-family:'Arial Black',Impact,sans-serif;user-select:none}
  #diff .box{background:#ded895;border:4px solid #543847;padding:20px 24px;text-align:center;min-width:240px}
  #diff h2{margin:0 0 14px;color:#fc7a24;-webkit-text-stroke:1px #543847;font-size:26px}
  #diff .opt{padding:10px;margin:8px 0;background:#73bf2e;border:3px solid #543847;color:#fff;cursor:pointer;font-size:16px;text-shadow:1px 1px #543847}
  #diff .opt:hover{background:#9ce659}
  #diff .opt.sel{background:#fc7a24}
  #diff small{display:block;margin-top:10px;color:#543847;font:12px Arial}
</style>

<body>
<canvas id="c" width="288" height="512"></canvas>
<div id="diff"><div class="box">
  <h2>DIFFICULTY</h2>
  <div class="opt" data-d="0">1 · Easy</div>
  <div class="opt" data-d="1">2 · Normal</div>
  <div class="opt" data-d="2">3 · Hard</div>
  <div class="opt" data-d="3">4 · Insane</div>
  <small>Ctrl + D or Esc to close</small>
</div></div>
<div id="mod">
  <h2>.ML Mod Menu</h2>
  <small>Ctrl + M, L to close</small>
  <div class="row"><div class="tog" id="godTog"><span>Anti-Die</span><div class="sw"></div></div></div>
  <div class="row">Speed: <b id="spdVal">1.0x</b>
    <input type="range" id="spd" min="0.5" max="4" step="0.1" value="1"></div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 288, H = 512, GY = 400, PW = 52, BX = 70;
const DARK = '#543847', FONT = "'Arial Black', Impact, sans-serif";
let bird, pipes, score, best = 0, state = 'loading', frame, groundX = 0, flash = 0, wingT = 0;
const t0 = performance.now(), LOAD_MS = 2000;
let GAP = 100;
const cheat = { god: false, speed: 1 };
const LEVELS = [
  { name: 'Easy',   gap: 130, speed: 1.2, spawn: 110 },
  { name: 'Normal', gap: 100, speed: 1.5, spawn: 100 },
  { name: 'Hard',   gap: 85,  speed: 1.9, spawn: 90 },
  { name: 'Insane', gap: 72,  speed: 2.3, spawn: 80 }];
let D = LEVELS[1], menuOpen = false;
try { best = +localStorage.getItem('flappyBest') || 0; } catch (e) {}

/* ---------- pre-rendered sprites ---------- */
const bodyMap = [
"....OOOOOO.......",
"..OOYYYYOWWWO....",
".OYYYYYYOWWWWWO..",
"OYYYYYYYOWWBWWO..",
"OYYYYYYYYOWWWWO..",
"OYYYYYYYYYOOOOOOO",
"OYYYYYYYYYORRRRRO",
"OYYYYYYYYYOROOOOO",
".OYYYYYYYYYORRRO.",
"..OOYYYYYYYYOOO..",
"....OOOOOOOOO...."];
const pal = {O:DARK, Y:'#f8d739', W:'#ffffff', B:'#000000', R:'#f45c2c'};
const birdImg = document.createElement('canvas'); birdImg.width = 17; birdImg.height = 11;
bodyMap.forEach((row, y) => [...row].forEach((ch, x) => {
  if (pal[ch]) { const g = birdImg.getContext('2d'); g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
}));

const bg = document.createElement('canvas'); bg.width = W; bg.height = GY;
(function(){
  const g = bg.getContext('2d');
  g.fillStyle = '#4ec0ca'; g.fillRect(0, 0, W, GY);
  // clouds
  g.fillStyle = '#d6f5e6';
  [[10,300,34],[60,310,40],[120,298,36],[170,312,42],[230,300,36],[270,310,30]].forEach(([x,y,r]) => {
    g.beginPath(); g.arc(x, y + 60, r, 0, 7); g.fill();
  });
  g.fillRect(0, 358, W, 40);
  // skyline
  const b = [[0,60],[24,95],[50,70],[78,120],[104,80],[128,105],[158,65],[186,110],[214,75],[240,100],[262,70]];
  b.forEach(([x,h],i) => {
    g.fillStyle = i % 2 ? '#a5dcd0' : '#b8e6d9';
    g.fillRect(x, 360 - h, 26, h + 6);
    g.fillStyle = '#d6f5e6';
    for (let wy = 364 - h; wy < 350; wy += 14) for (let wx = x + 4; wx < x + 22; wx += 9) g.fillRect(wx, wy, 4, 6);
  });
  // bushes
  g.fillStyle = '#5ee270';
  for (let x = -8; x < W + 20; x += 26) { g.beginPath(); g.arc(x, 392, 16, Math.PI, 0); g.fill(); }
  g.fillStyle = '#4bc95d'; g.fillRect(0, 390, W, 10);
})();

/* ---------- game logic ---------- */
function reset() {
  bird = { y: 220, vy: 0, rot: 0 };
  pipes = []; score = 0; frame = 0; flash = 0; state = 'ready';
}
function flap() {
  if (state === 'loading' || menuOpen) return;
  if (state === 'ready') state = 'play';
  if (state === 'play') bird.vy = -4.6;
  else if (state === 'dead' && frame > 40) reset();
}
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) flap(); }
});
cv.addEventListener('pointerdown', flap);

/* ---------- mod menu: hold Ctrl, press M then L ---------- */
const mod = document.getElementById('mod'), godTog = document.getElementById('godTog'),
      spd = document.getElementById('spd'), spdVal = document.getElementById('spdVal');
let seq = 0, seqT = 0;
document.addEventListener('keydown', e => {
  if (!e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === 'm') { seq = 1; seqT = performance.now(); e.preventDefault(); }
  else if (k === 'l' && seq === 1 && performance.now() - seqT < 1500) {
    e.preventDefault(); seq = 0;
    mod.style.display = mod.style.display === 'block' ? 'none' : 'block';
  }
}, true);
godTog.addEventListener('click', () => { cheat.god = !cheat.god; godTog.classList.toggle('on', cheat.god); });
spd.addEventListener('input', () => { cheat.speed = +spd.value; spdVal.textContent = cheat.speed.toFixed(1) + 'x'; });
spd.addEventListener('change', () => spd.blur());

/* ---------- difficulty menu: Ctrl + D ---------- */
const diffEl = document.getElementById('diff'), opts = [...diffEl.querySelectorAll('.opt')];
function showDiff(open) {
  if (state === 'loading') return;
  menuOpen = open; diffEl.style.display = open ? 'flex' : 'none';
  opts.forEach((o, i) => o.classList.toggle('sel', LEVELS[i] === D));
}
function setDiff(i) { D = LEVELS[i]; GAP = D.gap; showDiff(false); reset(); }
opts.forEach(o => o.addEventListener('click', () => setDiff(+o.dataset.d)));
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key.toLowerCase() === 'd') { e.preventDefault(); showDiff(!menuOpen); }
  else if (menuOpen && e.key === 'Escape') showDiff(false);
  else if (menuOpen && /^[1-4]$/.test(e.key)) setDiff(+e.key - 1);
}, true);

function die() {
  if (cheat.god) return;
  state = 'dead'; frame = 0; flash = 6;
  if (score > best) { best = score; try { localStorage.setItem('flappyBest', best); } catch (e) {} }
}
function step() {
  frame++; wingT++;
  if (state === 'loading' || menuOpen) return;
  if (flash > 0) flash--;
  if (state === 'ready') { bird.y = 220 + Math.sin(frame / 8) * 5; groundX = (groundX - 1.5) % 14; return; }
  if (state === 'dead') {
    if (bird.y < GY - 11) { bird.vy += 0.25; bird.y += bird.vy; bird.rot = Math.min(1.5, bird.rot + 0.12); }
    else { bird.y = GY - 11; }
    return;
  }
  groundX = (groundX - D.speed) % 14;
  bird.vy += 0.25; bird.y += bird.vy;
  bird.rot = Math.max(-0.45, Math.min(1.5, bird.vy * 0.1));
  if (frame % D.spawn === 1) pipes.push({ x: W, top: 60 + Math.random() * (GY - GAP - 120), scored: false });
  for (const p of pipes) {
    p.x -= D.speed;
    if (!p.scored && p.x + PW / 2 < BX) { p.scored = true; score++; }
    const hit = BX + 12 > p.x && BX - 12 < p.x + PW && (bird.y - 8 < p.top || bird.y + 8 > p.top + GAP);
    if (hit) die();
  }
  pipes = pipes.filter(p => p.x > -PW - 6);
  if (bird.y + 11 >= GY) { bird.y = GY - 11; if (cheat.god) bird.vy = 0; die(); }
  if (bird.y < 11) { bird.y = 11; bird.vy = 0; }
}

/* ---------- drawing ---------- */
function txt(t, x, y, size, fill = '#fff', stroke = DARK, lw = 4) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function drawBird(x, y, rot, animate = true) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(rot);
  ctx.drawImage(birdImg, -17, -11, 34, 22);
  const wy = animate ? [-3, 1, 4, 1][Math.floor(wingT / 4) % 4] : 1;
  ctx.fillStyle = DARK; ctx.fillRect(-14, wy - 1, 14, 8);
  ctx.fillStyle = '#fbefb2'; ctx.fillRect(-13, wy, 12, 6);
  ctx.fillStyle = '#e8cf6a'; ctx.fillRect(-13, wy + 4, 12, 2);
  ctx.restore();
}
function drawPipe(p) {
  const piece = (x, y, w, h) => {
    ctx.fillStyle = DARK; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#73bf2e'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.fillStyle = '#9ce659'; ctx.fillRect(x + 4, y + 2, 5, h - 4);
    ctx.fillStyle = '#558022'; ctx.fillRect(x + w - 10, y + 2, 8, h - 4);
  };
  const x = Math.round(p.x), bot = p.top + GAP;
  piece(x + 2, -4, PW - 4, p.top - 22 + 4);        // top body
  piece(x, p.top - 26, PW, 26);                     // top cap
  piece(x + 2, bot + 26, PW - 4, GY - bot - 26);   // bottom body
  piece(x, bot, PW, 26);                            // bottom cap
}
function drawGround() {
  ctx.fillStyle = '#ded895'; ctx.fillRect(0, GY, W, H - GY);
  ctx.fillStyle = DARK; ctx.fillRect(0, GY, W, 2);
  ctx.fillStyle = '#73bf2e'; ctx.fillRect(0, GY + 2, W, 12);
  ctx.fillStyle = '#9ce659';
  for (let x = groundX - 14; x < W + 14; x += 14) {
    ctx.beginPath(); ctx.moveTo(x + 6, GY + 2); ctx.lineTo(x + 13, GY + 2);
    ctx.lineTo(x + 7, GY + 14); ctx.lineTo(x, GY + 14); ctx.fill();
  }
  ctx.fillStyle = '#558022'; ctx.fillRect(0, GY + 14, W, 3);
  ctx.fillStyle = '#e9e6a1'; ctx.fillRect(0, GY + 17, W, 3);
  ctx.fillStyle = '#d2b04c'; ctx.fillRect(0, GY + 20, W, 3);
}
function draw() {
  ctx.drawImage(bg, 0, 0);
  if (state === 'loading') return drawLoading();
  pipes.forEach(drawPipe);
  drawGround();
  drawBird(BX, bird.y, bird.rot, state !== 'dead');
  if (state === 'play') txt(score, W / 2, 70, 38, '#fff', DARK, 6);
  if (state === 'ready') {
    txt('Get Ready!', W / 2, 120, 30, '#fc7a24', DARK, 6);
    txt('SPACE or ↑ to flap', W / 2, 300, 14, '#fff', DARK, 4);
    txt('Best: ' + best, W / 2, 330, 14, '#fff', DARK, 4);
    txt('Mode: ' + D.name, W / 2, 355, 14, '#fff', DARK, 4);
  }
  if (state === 'dead' && frame > 12) {
    txt('GAME OVER', W / 2, 110, 32, '#fc7a24', DARK, 6);
    const x = 31, y = 160, w = 226, h = 100;
    ctx.fillStyle = DARK; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#ded895'; ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
    ctx.fillStyle = '#d2b04c'; ctx.fillRect(x + 3, y + h - 9, w - 6, 6);
    ctx.textAlign = 'left'; ctx.font = `12px ${FONT}`; ctx.fillStyle = '#fc7a24'; ctx.lineWidth = 0;
    txt('SCORE', x + 55, y + 28, 12, '#fc7a24', '#fff', 3);
    txt('BEST', x + 170, y + 28, 12, '#fc7a24', '#fff', 3);
    txt(score, x + 55, y + 62, 28, '#fff', DARK, 5);
    txt(best, x + 170, y + 62, 28, '#fff', DARK, 5);
    if (frame > 40) txt('SPACE or ↑ to retry', W / 2, 300, 14, '#fff', DARK, 4);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash / 6})`; ctx.fillRect(0, 0, W, H); }
}
function drawLoading() {
  const p = Math.min(1, (performance.now() - t0) / LOAD_MS);
  ctx.fillStyle = '#4ec0ca'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(bg, 0, 0);
  drawGround();
  txt('FLAPPY BIRD', W / 2, 150, 34, '#fc7a24', DARK, 7);
  drawBird(W / 2, 205 + Math.sin(wingT / 6) * 5, 0, true);
  txt('Loading' + '.'.repeat(1 + Math.floor(wingT / 15) % 3), W / 2, 270, 16, '#fff', DARK, 4);
  ctx.fillStyle = DARK; ctx.fillRect(44, 290, 200, 18);
  ctx.fillStyle = '#ded895'; ctx.fillRect(47, 293, 194, 12);
  ctx.fillStyle = '#73bf2e'; ctx.fillRect(47, 293, 194 * p, 12);
  ctx.fillStyle = '#9ce659'; ctx.fillRect(47, 293, 194 * p, 4);
  txt('by .ML your Classmate', W / 2, 440, 15, '#fff', DARK, 5);
}

/* ---------- main loop (fixed 60 updates/sec on any monitor) ---------- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  const dt = 1000 / 60 / cheat.speed;
  while (acc >= dt) { step(); acc -= dt; }
  if (state === 'loading' && now - t0 >= LOAD_MS) reset();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
